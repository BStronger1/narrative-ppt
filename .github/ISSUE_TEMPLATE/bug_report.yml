name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿提交 API Key、私有材料或原始配置。安全问题请使用私下漏洞报告。"
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用虚构材料描述最小复现，说明页数、演示/真实模式。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Python/Node 版本、模型名称（不要写密钥）。
